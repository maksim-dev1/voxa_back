# Runs on nexus: storage-relay + worker only. Postgres (voxa-pg, port
# 5438) and Redis are already provisioned separately (diskman / shared
# nexus redis) — this compose file does not manage them, it just points
# at them via DATABASE_URL / REDIS_URL in .env.
#
# voxa-api is NOT here — it deploys on Pi via Dokploy from api/Dockerfile.
#
# Both storage-relay and worker run as uid 10001 (non-root, baked into
# their Dockerfiles) — /data/voxa/recordings and /data/voxa/models must be
# `chown 10001:10001` on the host, otherwise both containers hit
# permission denied writing to their mounts.

services:
  storage-relay:
    build: ./storage-relay
    env_file: .env
    ports:
      - "8100:8100"
    volumes:
      - /data/voxa/recordings:/data/voxa/recordings
    restart: unless-stopped

  worker:
    build: ./worker
    env_file: .env
    volumes:
      - /data/voxa/recordings:/data/voxa/recordings
      - /data/voxa/models:/data/voxa/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
